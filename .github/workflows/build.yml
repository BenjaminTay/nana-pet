name: Build packages

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  macos:
    name: Build macOS arm64 package
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-build.txt

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-build.txt

      - name: Generate macOS icon
        run: python tools/gen_icon.py

      - name: Build app and DMG
        env:
          PYTHON: python
        run: ./packaging/macos/build_mac.sh

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nana-dog-macos-arm64
          if-no-files-found: error
          path: |
            dist/NANA DOG.app
            dist/NANA DOG.dmg

  windows:
    name: Build Windows package
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-build.txt

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-build.txt

      - name: Build application
        run: python -m PyInstaller "packaging/windows/NANA DOG.spec" --noconfirm

      - name: Build installer
        run: python -m PyInstaller "packaging/windows/NANA DOG Setup.spec" --noconfirm

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nana-dog-windows
          if-no-files-found: error
          path: |
            dist/NANA DOG
            dist/NANA DOG Setup.exe

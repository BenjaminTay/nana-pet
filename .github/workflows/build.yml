name: Build packages

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  macos:
    name: Build macOS arm64 package
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-build.txt

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-build.txt

      - name: Generate macOS icon
        run: python tools/gen_icon.py

      - name: Build app and DMG
        env:
          PYTHON: python
        run: ./packaging/macos/build_mac.sh

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nana-dog-macos-arm64
          if-no-files-found: error
          path: |
            dist/NANA DOG.app
            dist/NANA DOG-macOS-arm64-App.zip
            dist/NANA DOG.dmg

  windows:
    name: Build Windows package
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-build.txt

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-build.txt

      - name: Build application
        run: python -m PyInstaller "packaging/windows/NANA DOG.spec" --noconfirm

      - name: Build single-file portable application
        run: python -m PyInstaller "packaging/windows/NANA DOG Portable.spec" --noconfirm

      - name: Build installer
        run: python -m PyInstaller "packaging/windows/NANA DOG Setup.spec" --noconfirm

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nana-dog-windows
          if-no-files-found: error
          path: |
            dist/NANA DOG
            dist/NANA DOG Portable.exe
            dist/NANA DOG Setup.exe

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [macos, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: nana-dog-macos-arm64
          path: release-assets/macos

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: nana-dog-windows
          path: release-assets/windows

      - name: Prepare release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets/upload
          cp "release-assets/macos/NANA DOG.dmg" \
             "release-assets/upload/NANA DOG-macOS-arm64.dmg"
          cp "release-assets/macos/NANA DOG-macOS-arm64-App.zip" \
             "release-assets/upload/NANA DOG-macOS-arm64-App.zip"
          cp "release-assets/windows/NANA DOG Setup.exe" \
             "release-assets/upload/NANA DOG-Windows-Setup.exe"
          cp "release-assets/windows/NANA DOG Portable.exe" \
             "release-assets/upload/NANA DOG-Windows-Portable.exe"
          test -d "release-assets/windows/NANA DOG"
          (cd release-assets/windows && \
            zip -r "../upload/NANA DOG-Windows-Portable.zip" "NANA DOG")
          (cd release-assets/upload && \
            sha256sum "NANA DOG-macOS-arm64.dmg" \
                      "NANA DOG-macOS-arm64-App.zip" \
                      "NANA DOG-Windows-Setup.exe" \
                      "NANA DOG-Windows-Portable.exe" \
                      "NANA DOG-Windows-Portable.zip" \
              > SHA256SUMS.txt)

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "NANA DOG $GITHUB_REF_NAME" \
            --generate-notes \
            release-assets/upload/*

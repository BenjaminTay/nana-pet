name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install runtime dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Install Linux Qt runtime
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libxkbcommon-x11-0

      - name: Run cross-platform tests
        shell: bash
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python tests/test_enhance.py
          python tests/test_main.py
          python tests/test_mac.py
          python tests/test_scale.py
          python tests/test_hotkeys.py
          python tests/test_animation_assets.py

      - name: Run Windows native window tests
        if: runner.os == 'Windows'
        env:
          QT_QPA_PLATFORM: windows
        run: |
          python tests/test_top.py
          python tests/test_zorder.py
